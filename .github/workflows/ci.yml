name: CI

# Every quality gate in this repo is local, and setup.sh skips typecheck and
# tests entirely under SKIP_CHECKS=1 — which the readme advertises as the fast
# path. Nothing has been stopping an unvalidated question bank from being
# committed. This runs the offline gates on every push and pull request.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # better-sqlite3 is a native addon. ubuntu-latest ships python3, make and
      # g++, so no extra install step is needed; if a runner image ever drops
      # them this is the step that will fail first and the Dockerfile shows
      # what to add.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Includes the bank gates that need no API key and no database:
      # latex-render (every math segment parses in KaTeX),
      # numeric-gradability (every numeric answer can be typed by a human),
      # notation (no markdown or stale delimiters in either content set), and
      # lessons (every lesson passes the readability and shape gates).
      - name: Test
        run: npm test

      # Reads the committed lesson content, so it needs no database.
      - name: Verify lessons
        run: npm run verify:lessons
